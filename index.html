<!DOCTYPE html><html><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatic Dreams</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            position: relative;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.js"></script>

<base target="_self">


    </head><body><div id="canvas-container"></div>

    <script>
        const sketch = (p) => {
            let fish = [];
            let bubbles = [];
            let plants = [];
            let bgGradient;
            let maxFish = 30;
            let interactionRadius = 150;
            let lastClickTime = 0;
            let clickCooldown = 500;
            let colorPalettes = [
                ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7'],
                ['#264653', '#2A9D8F', '#E9C46A', '#F4A261', '#E76F51'],
                ['#011627', '#FF3366', '#2EC4B6', '#F6F7F8', '#20A4F3']
            ];
            let currentPalette = 0;

            p.setup = () => {
                let canvas = p.createCanvas(p.min(p.windowWidth, 1200), p.min(p.windowHeight, 800));
                canvas.parent('canvas-container');
                p.colorMode(p.HSB, 360, 100, 100, 1);
                
                createBackground();
                initializePlants();
                
                for (let i = 0; i < 15; i++) {
                    addFish();
                }
                
                for (let i = 0; i < 30; i++) {
                    addBubble();
                }
            };

            function createBackground() {
                bgGradient = p.createGraphics(p.width, p.height);
                for (let y = 0; y < p.height; y++) {
                    let inter = p.map(y, 0, p.height, 0, 1);
                    let c = p.lerpColor(
                        p.color(200, 70, 30),
                        p.color(220, 90, 10),
                        inter
                    );
                    bgGradient.stroke(c);
                    bgGradient.line(0, y, p.width, y);
                }
            }

            function initializePlants() {
                for (let i = 0; i < 8; i++) {
                    plants.push({
                        x: p.random(p.width),
                        height: p.random(50, 200),
                        width: p.random(10, 30),
                        sway: p.random(0.01, 0.03),
                        phase: p.random(p.TWO_PI),
                        color: p.color(p.random(100, 150), 70, 40)
                    });
                }
            }

            function addFish() {
                if (fish.length >= maxFish) return;
                
                let palette = colorPalettes[currentPalette];
                let col = p.color(palette[p.floor(p.random(palette.length))]);
                
                fish.push({
                    pos: p.createVector(p.random(p.width), p.random(p.height)),
                    vel: p.createVector(p.random(-1, 1), p.random(-0.5, 0.5)),
                    size: p.random(20, 50),
                    color: col,
                    wiggleSpeed: p.random(0.05, 0.2),
                    wiggleAmount: p.random(5, 15),
                    wigglePhase: p.random(p.TWO_PI),
                    followFactor: p.random(0.5, 1.5),
                    avoidanceRadius: p.random(30, 80)
                });
            }

            function addBubble() {
                bubbles.push({
                    x: p.random(p.width),
                    y: p.height + p.random(20),
                    size: p.random(5, 15),
                    speed: p.random(1, 3),
                    wobble: p.random(0.02, 0.1),
                    wobblePhase: p.random(p.TWO_PI),
                    alpha: p.random(0.3, 0.8)
                });
            }

            p.draw = () => {
                p.image(bgGradient, 0, 0);
                
                drawPlants();
                updateBubbles();
                updateFish();
                
                if (p.frameCount % 120 === 0 && bubbles.length < 50) {
                    addBubble();
                }
                
                drawInteractionHint();
            };

            function drawPlants() {
                p.noStroke();
                for (let plant of plants) {
                    let swayX = p.sin(p.frameCount * plant.sway + plant.phase) * 10;
                    p.fill(plant.color);
                    
                    for (let y = 0; y < plant.height; y += 2) {
                        let width = p.map(y, 0, plant.height, plant.width, 2);
                        let xOffset = p.map(y, 0, plant.height, swayX, swayX * 0.2);
                        p.ellipse(plant.x + xOffset, p.height - y, width);
                    }
                }
            }

            function updateBubbles() {
                p.noStroke();
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    let b = bubbles[i];
                    b.y -= b.speed;
                    b.x += p.sin(p.frameCount * b.wobble + b.wobblePhase) * 0.5;
                    
                    let bubbleColor = p.color(180, 30, 100, b.alpha);
                    p.fill(bubbleColor);
                    p.circle(b.x, b.y, b.size);
                    
                    if (b.y < -b.size) {
                        bubbles.splice(i, 1);
                    }
                }
            }

            function updateFish() {
                let mousePos = p.createVector(p.mouseX, p.mouseY);
                
                for (let f of fish) {
                    // Calculate distance to mouse
                    let distToMouse = p.dist(f.pos.x, f.pos.y, mousePos.x, mousePos.y);
                    
                    // Fish behavior based on mouse interaction
                    if (distToMouse < interactionRadius) {
                        let angleToMouse = p.atan2(mousePos.y - f.pos.y, mousePos.x - f.pos.x);
                        
                        if (p.mouseIsPressed) {
                            // Avoid mouse when clicked
                            let avoidanceForce = p.createVector(
                                p.cos(angleToMouse + p.PI) * f.followFactor,
                                p.sin(angleToMouse + p.PI) * f.followFactor
                            );
                            f.vel.add(avoidanceForce.mult(2));
                        } else {
                            // Follow mouse when not clicked
                            let followForce = p.createVector(
                                p.cos(angleToMouse) * f.followFactor * 0.5,
                                p.sin(angleToMouse) * f.followFactor * 0.5
                            );
                            f.vel.add(followForce);
                        }
                    }
                    
                    // Apply natural movement
                    f.vel.limit(3);
                    f.pos.add(f.vel);
                    
                    // Add some random movement
                    if (p.random() < 0.05) {
                        f.vel.add(p.createVector(p.random(-0.5, 0.5), p.random(-0.2, 0.2)));
                    }
                    
                    // Boundary checking
                    if (f.pos.x < -f.size) f.pos.x = p.width + f.size;
                    if (f.pos.x > p.width + f.size) f.pos.x = -f.size;
                    if (f.pos.y < -f.size) f.pos.y = p.height + f.size;
                    if (f.pos.y > p.height + f.size) f.pos.y = -f.size;
                    
                    // Draw fish
                    drawFish(f);
                }
            }

            function drawFish(f) {
                p.push();
                p.translate(f.pos.x, f.pos.y);
                
                // Calculate wiggle
                let wiggle = p.sin(p.frameCount * f.wiggleSpeed + f.wigglePhase) * f.wiggleAmount;
                
                // Body
                p.fill(f.color);
                p.noStroke();
                p.ellipse(0, 0, f.size, f.size * 0.6);
                
                // Tail
                p.push();
                p.rotate(p.atan2(f.vel.y, f.vel.x));
                p.triangle(
                    -f.size * 0.5, 0,
                    -f.size * 0.8, -f.size * 0.3 + wiggle,
                    -f.size * 0.8, f.size * 0.3 - wiggle
                );
                p.pop();
                
                // Eye
                p.fill(0);
                p.circle(f.size * 0.2, -f.size * 0.1, f.size * 0.1);
                p.pop();
            }

            function drawInteractionHint() {
                if (p.frameCount % 120 < 60 && p.frameCount > 120) {
                    let alpha = p.map(p.frameCount % 60, 0, 60, 0, 1);
                    p.fill(255, alpha * 100);
                    p.noStroke();
                    p.textSize(16);
                    p.textAlign(p.CENTER);
                    p.text("Move mouse to interact • Click to scatter fish", p.width/2, p.height - 30);
                }
            }

            p.mousePressed = () => {
                let now = p.millis();
                if (now - lastClickTime > clickCooldown) {
                    lastClickTime = now;
                    
                    // Change color palette on click
                    currentPalette = (currentPalette + 1) % colorPalettes.length;
                    
                    // Update fish colors
                    let palette = colorPalettes[currentPalette];
                    for (let f of fish) {
                        f.color = p.color(palette[p.floor(p.random(palette.length))]);
                    }
                    
                    // Add some bubbles at click position
                    for (let i = 0; i < 5; i++) {
                        bubbles.push({
                            x: p.mouseX + p.random(-20, 20),
                            y: p.mouseY + p.random(-20, 20),
                            size: p.random(5, 15),
                            speed: p.random(2, 4),
                            wobble: p.random(0.02, 0.1),
                            wobblePhase: p.random(p.TWO_PI),
                            alpha: p.random(0.5, 0.9)
                        });
                    }
                }
            };

            p.keyPressed = () => {
                if (p.key === ' ') {
                    addFish();
                }
            };

            p.windowResized = () => {
                p.resizeCanvas(p.min(p.windowWidth, 1200), p.min(p.windowHeight, 800));
                createBackground();
            };
        };

        new p5(sketch);
    </script>

              
          
                
          
              
</body></html>
